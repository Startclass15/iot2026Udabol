<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Intenet de las cosas</h1>
    <h2>Monitoreo IOT</h2>
    <br>
    <h2>Datos del Sensor</h2>
    <p>Distancia: <strong id="distancia">--</strong></p>
    <p>Movimiento: <strong id="movimiento">--</strong></p>
    <p>Puerta: <strong id="puerta">--</strong></p>

    <br>
    <h2>Reporte del analisis</h2>
    <p id="reporte">Esperando reporte...</p>

    <br>
    <h2>Activacion de Comandos</h2>
    <form id="formulario">
        <input type="text"
            id="comando"
            required,
            placeholder="Ingresar el comando ej(/ayuda)"
        >
        <button type="submit">Activar</button>
        <script>
            async function actualizar() {
                try{
                    const respuesta= await fetch("/estado");
                    if (!respuesta.ok){
                        throw new Error("Error en el servidor");
                    }
                    const resultado=await respuesta.json();
                    const datos=resultado.datos;
                    document.getElementById("distancia").textContent=datos.distancia;
                    document.getElementById("movimiento").textContent=datos.movimiento;
                    document.getElementById("puerta").textContent=datos.puerta;
                    document.getElementById("reporte").textContent=resultado.reporte
                }catch(error){
                    alert("Error de conexion")
                }
            }
            actualizar()
        </script>

    </form>
</body>
</html>
